name: Build Android APK

on:
  push:
    branches: [ctrader-mvp, main]
    paths:
      - 'mobile/**'
  workflow_dispatch:
  pull_request:
    branches: [ctrader-mvp, main]

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Build mobile PWA
        working-directory: mobile
        run: npm run build

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Capacitor dependencies
        working-directory: mobile
        run: npm install @capacitor/cli @capacitor/core @capacitor/android

      - name: Initialize Capacitor (if needed)
        working-directory: mobile
        run: |
          if [ ! -f "capacitor.config.json" ]; then
            npx cap init "GuardRails" "com.guardrails.mobile" --web-dir dist
          fi

      - name: Add Android platform (if needed)
        working-directory: mobile
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        working-directory: mobile
        run: npx cap sync android

      - name: Make gradlew executable
        working-directory: mobile/android
        run: chmod +x gradlew

      - name: Build APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: guardrails-mobile-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30